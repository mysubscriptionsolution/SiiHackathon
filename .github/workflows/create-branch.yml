name: Create Branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (optional)"
        required: false

permissions:
  contents: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.create.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push branch
        id: create
        env:
          BRANCH_INPUT: ${{ github.event.inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$BRANCH_INPUT" ]; then
            BRANCH="$BRANCH_INPUT"
          else
            BRANCH="auto-branch-$(date +%s)"
          fi

          # determine default branch if not provided
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            git remote set-head origin --auto || true
            DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null || true)
            DEFAULT_BRANCH=${DEFAULT_BRANCH#refs/remotes/origin/}
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ensure default branch exists locally
          git fetch origin "$DEFAULT_BRANCH":"refs/remotes/origin/$DEFAULT_BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists, creating local tracking branch"
            git fetch origin "$BRANCH":"refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH" || git checkout -b "$BRANCH" "origin/$DEFAULT_BRANCH"
            git push origin "$BRANCH"
          fi

          echo "Created branch $BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

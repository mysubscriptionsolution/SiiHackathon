name: Create Feature Branch

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Feature name (optional)'
        required: false

permissions:
  contents: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.create.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create feature branch and push
        id: create
        env:
          FEATURE_NAME: ${{ github.event.inputs.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # determine default branch if not provided by event payload
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            git remote set-head origin --auto || true
            DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null || true)
            DEFAULT_BRANCH=${DEFAULT_BRANCH#refs/remotes/origin/}
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
            fi
          fi

          if [ -n "$FEATURE_NAME" ]; then
            # normalize: lowercase, replace non-allowed characters with '-', collapse dashes, trim
            SAFE_NAME=$(echo "$FEATURE_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._ -]+/-/g; s/[[:space:]]+/-/g; s/^-+|-+$//g; s/-+/-/g')
            BRANCH="feature/$SAFE_NAME"
          else
            BRANCH="feature/$(date +%Y%m%d-%H%M%S)"
          fi

          echo "Creating branch '$BRANCH' from '$DEFAULT_BRANCH'"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ensure default branch is available locally
          git fetch origin "$DEFAULT_BRANCH":"refs/remotes/origin/$DEFAULT_BRANCH"

          # if branch exists on remote, create local tracking branch; otherwise create from default and push
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists, creating local tracking branch"
            git fetch origin "$BRANCH":"refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH" "origin/$DEFAULT_BRANCH"
            git push origin "$BRANCH"
          fi

          echo "Created branch $BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
